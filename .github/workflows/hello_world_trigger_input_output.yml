name: Enhanced Hello World
# 2025/11/07
on:
  # Manual trigger with inputs
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated list of repos (e.g., owner/repo1,owner/repo2) with correct capitalization of owners and repositories"
        required: false
        #default: "Azure-Samples/azure-typescript-e2e-apps"

  # Schedule trigger (every Monday at 9 AM UTC)
  schedule:
    - cron: "0 9 * * 1"

jobs:
  enhanced-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js LTS
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"

      - name: Activity check
        working-directory: github-issues-and-prs
        env:
          GITHUB_TOKEN: ${{ secrets.WEEKLYINFO_GITHUB_TOKEN }}
        run: |
          npm install
          DATE=$(date +%Y-%m-%d)
          npm run start > ../activity-${DATE}-${{ github.run_number }}.txt 2>&1

      - name: Upload report artifact
        uses: actions/upload-artifact@v5
        with:
          name: activity-report-${{ github.run_number }}
          path: activity-*.txt
          retention-days: 30
